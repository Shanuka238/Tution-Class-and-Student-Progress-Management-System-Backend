name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Check code style
        run: npm run lint || true
      
      - name: Verify build
        env:
          NODE_ENV: production
        run: |
          node server.js &
          sleep 3
          curl -f http://localhost:5000/health || echo "Health check endpoint not responding"
          kill $! || true
